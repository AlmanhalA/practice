name: events demo
on:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: output events data
      run: echo "${{ toJSON(github.event) }}"
    - name: get code:
      uses: actions/checkout@v3
    - name: install dependancies
      run: npm ci
    - name: test code
      run: npm run test
    - name: build 
      run: npm run build